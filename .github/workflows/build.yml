name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release --arch arm64 --arch x86_64 --product transfer-center
      - name: Package
        run: ./scripts/package-plugin.sh
      - name: Validate package
        run: |
          ./scripts/check-package.sh TransferCenter.dynamiclakeplugin
          ./scripts/check-package.sh dist/TransferCenter-0.1.0.dynamiclakeplugin.zip
      - name: Socket protocol smoke test
        run: ./scripts/socket-smoke.py "$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/transfer-center"
      - uses: actions/upload-artifact@v4
        with:
          name: TransferCenter-dynamiclakeplugin
          path: dist/*.dynamiclakeplugin.zip
