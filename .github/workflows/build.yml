name: Build

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release --arch arm64 --arch x86_64 --product usb-ssd-status
      - name: Package
        run: ./scripts/package-plugin.sh
      - name: Validate package
        run: |
          ./scripts/check-package.sh USB-SSD-Status.dynamiclakeplugin
          ./scripts/check-package.sh "dist/USB-SSD-Status-$(jq -r .version plugin.json).dynamiclakeplugin.zip"
      - name: Socket protocol smoke test
        run: ./scripts/socket-smoke.py "$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/usb-ssd-status"
      - uses: actions/upload-artifact@v4
        with:
          name: USB-SSD-Status-dynamiclakeplugin
          path: dist/*.dynamiclakeplugin.zip
